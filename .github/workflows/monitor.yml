name: IAF Enrolment Website Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iaf-enrolment-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IAF monitor through Google Apps Script relay
        env:
          APPS_SCRIPT_URL: __SECRET_APPS_SCRIPT_URL__
          APPS_SCRIPT_TOKEN: __SECRET_APPS_SCRIPT_TOKEN__
          GMAIL_ADDRESS: __SECRET_GMAIL_ADDRESS__
          GMAIL_APP_PASSWORD: __SECRET_GMAIL_APP_PASSWORD__
          ALERT_EMAILS: __SECRET_ALERT_EMAILS__
        run: python monitor.py

      - name: Save monitoring history
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update IAF website monitoring history"
              git push
            fi
          fi
